[pytest]
# ==============================================================================
# Pytest Configuration for SelfAI NPU Agent
# ==============================================================================

# Test Discovery
# ------------------------------------------------------------------------------
# Where pytest should look for tests
testpaths = tests

# Pattern for test files
python_files = test_*.py

# Pattern for test classes
python_classes = Test*

# Pattern for test functions
python_functions = test_*


# Output and Reporting
# ------------------------------------------------------------------------------
# Console output verbosity
# -v: verbose, -vv: very verbose, -q: quiet
addopts =
    # Verbose output showing test names
    -v
    # Show local variables in tracebacks (helpful for debugging)
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail if unknown marker is used)
    --strict-markers
    # Warnings as errors (catch deprecations early)
    --strict-config
    # Show durations of slowest tests
    --durations=10
    # Color output
    --color=yes
    # Show coverage report (if pytest-cov installed)
    # --cov=selfai
    # --cov=config_loader
    # --cov-report=term-missing
    # --cov-report=html


# Test Markers
# ------------------------------------------------------------------------------
# Custom markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (multiple components working together)
    slow: Tests that take more than 1 second
    network: Tests that require network access (skip in offline mode)
    hardware: Tests that require specific hardware (NPU, etc.)
    backend: Tests for LLM backend interfaces
    config: Tests for configuration loading
    planner: Tests for planning phase
    execution: Tests for execution phase
    fallback: Tests for fallback mechanisms
    memory: Tests for memory system


# Warnings
# ------------------------------------------------------------------------------
# How to handle warnings
filterwarnings =
    # Treat all warnings as errors (strict mode)
    # error
    # Or ignore specific warnings:
    # ignore::DeprecationWarning
    # ignore::PendingDeprecationWarning


# Logging
# ------------------------------------------------------------------------------
# How pytest handles logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test_output.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S


# Coverage
# ------------------------------------------------------------------------------
[coverage:run]
# Files to include in coverage
source =
    selfai
    config_loader.py

# Files to exclude from coverage
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

# Branch coverage (not just line coverage)
branch = True

[coverage:report]
# Fail if coverage drops below this percentage
fail_under = 70

# Show lines that weren't covered
show_missing = True

# Precision for coverage percentage
precision = 2

# Exclude certain lines from coverage
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Defensive programming
    raise AssertionError
    raise NotImplementedError
    # Debugging code
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    # Abstract methods
    @abstractmethod
    # Ellipsis
    \.\.\.


[coverage:html]
directory = htmlcov


# Tool-specific Settings
# ------------------------------------------------------------------------------
# Docstring style checking (if using pytest-pydocstyle)
[pydocstyle]
convention = google
add-ignore = D100,D104


# Type checking integration (if using pytest-mypy)
[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
