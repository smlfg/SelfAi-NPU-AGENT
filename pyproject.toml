[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfai-npu-agent"
version = "2.0.0"
description = "AI-powered terminal chatbot with multi-backend inference support and NPU acceleration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "SelfAI Team", email = "dev@selfai.example.com"}
]
maintainers = [
    {name = "SelfAI Team", email = "dev@selfai.example.com"}
]
keywords = [
    "ai",
    "chatbot",
    "npu",
    "llm",
    "inference",
    "snapdragon",
    "agent",
    "planning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Core dependencies for CPU-based operation
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "llama-cpp-python>=0.2.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "tabulate>=0.9.0",
    "smmap>=5.0.0",
    "psutil>=5.9.0",
    "qai-hub-models>=0.1.0",
    "smolagents>=0.1.0",
]

[project.optional-dependencies]
# NPU-accelerated backend dependencies
npu = [
    "httpx==0.28.1",
    "qai-hub-models>=0.1.0",
]

# Development dependencies
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "coverage[toml]>=7.4.0",
    "pre-commit>=3.6.0",
]

# Documentation dependencies
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
]

# All optional dependencies combined
all = [
    "selfai-npu-agent[npu,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/smlfg/SelfAi-NPU-AGENT"
Documentation = "https://github.com/smlfg/SelfAi-NPU-AGENT/blob/main/README.md"
Repository = "https://github.com/smlfg/SelfAi-NPU-AGENT"
Issues = "https://github.com/smlfg/SelfAi-NPU-AGENT/issues"
Changelog = "https://github.com/smlfg/SelfAi-NPU-AGENT/blob/main/CHANGELOG.md"

[project.scripts]
selfai = "selfai.selfai:main"
selfai-chat = "llm_chat:main"

# ============================================================================
# Tool Configuration
# ============================================================================

[tool.setuptools.packages.find]
where = ["."]
include = ["selfai*", "config_loader"]
exclude = ["tests*", "legacy_reference*", "archive*"]

[tool.setuptools.package-data]
selfai = ["py.typed"]

# ============================================================================
# Black - Code Formatter
# ============================================================================
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | legacy_reference
  | archive
)/
'''

# ============================================================================
# isort - Import Sorter
# ============================================================================
[tool.isort]
profile = "black"
line_length = 88
py_version = 312
known_first_party = ["selfai", "config_loader"]
known_third_party = ["pytest", "numpy", "yaml", "dotenv"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_gitignore = true
extend_skip_glob = ["legacy_reference/*", "archive/*"]
force_single_line = false
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# ============================================================================
# mypy - Static Type Checker
# ============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Exclude legacy and external code
exclude = [
    "^legacy_reference/",
    "^archive/",
    "^build/",
    "^dist/",
]

[[tool.mypy.overrides]]
module = [
    "llama_cpp.*",
    "qai_hub_models.*",
    "smolagents.*",
    "pyarrow.*",
    "smmap.*",
]
ignore_missing_imports = true

# ============================================================================
# pytest - Testing Framework
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--cov=selfai",
    "--cov=config_loader",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-branch",
    "--cov-fail-under=80",
    "--timeout=60",
]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (may involve I/O)",
    "slow: Slow tests (e.g., model loading)",
    "npu: Tests requiring NPU hardware",
    "cpu: Tests for CPU fallback",
    "smoke: Smoke tests for quick validation",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# ============================================================================
# coverage - Code Coverage
# ============================================================================
[tool.coverage.run]
source = ["selfai", "config_loader"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/legacy_reference/*",
    "*/archive/*",
    "*/setup.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# pylint - Code Linter
# ============================================================================
[tool.pylint.main]
py-version = "3.12"
ignore = ["legacy_reference", "archive", "build", "dist"]
jobs = 0  # Use all available CPUs

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring (we use mypy for this)
    "C0103",  # invalid-name (we have our own conventions)
    "R0903",  # too-few-public-methods (dataclasses are fine)
    "W0212",  # protected-access (needed for tests)
]

[tool.pylint.format]
max-line-length = 88
indent-string = "    "

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-locals = 20
max-branches = 15
max-statements = 60

[tool.pylint.similarities]
min-similarity-lines = 10
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

# ============================================================================
# ruff - Fast Python Linter (Alternative to pylint/flake8)
# ============================================================================
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "legacy_reference",
    "archive",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "E501",  # Line too long (handled by Black)
    "B008",  # Do not perform function call in argument defaults
    "B904",  # Within an except clause, raise exceptions with raise ... from err
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"tests/*.py" = ["S101"]   # Allow assert statements in tests

[tool.ruff.lint.isort]
known-first-party = ["selfai", "config_loader"]

# ============================================================================
# bandit - Security Linter
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "legacy_reference", "archive"]
skips = ["B101"]  # Allow assert statements

# ============================================================================
# commitizen - Conventional Commits
# ============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "2.0.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "selfai/__init__.py:__version__",
]
