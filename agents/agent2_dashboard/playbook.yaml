# Agent 2: System Dashboard & Monitoring - Playbook Configuration
# Conforms to shared/config_schema.yaml

playbook:
  # Metadata
  name: "DGX Dashboard"
  agent_id: "agent2_dashboard"
  version: "1.0.0"
  description: "Web UI + GPU Monitoring for AI/ML infrastructure"

  # Python dependencies
  dependencies:
    - "flask>=2.3.0"
    - "flask-cors>=4.0.0"
    - "psutil>=5.9.0"
    - "pynvml>=11.5.0"
    - "requests>=2.31.0"

  # System dependencies
  system_dependencies:
    - "nvidia-smi"
    - "cuda-toolkit-12-4"

  # Network configuration
  ports:
    - 11000  # Main dashboard API

  # Volume mounts
  volumes:
    - host: "./playbooks/dgx-dashboard/logs"
      container: "/app/logs"
      mode: "rw"
    - host: "./jupyter_sessions"
      container: "/app/jupyter_sessions"
      mode: "rw"
    - host: "./playbooks/dgx-dashboard/config.env"
      container: "/app/config.env"
      mode: "ro"

  # Resource requirements
  resources:
    gpu_required: true
    gpu_count: 0  # Can monitor GPUs without allocating them
    memory_gb: 8
    cpu_cores: 4

  # Health check configuration
  health_check:
    endpoint: "/api/health"
    interval_seconds: 30
    timeout_seconds: 10
    retries: 3

  # Environment variables
  environment:
    DASHBOARD_HOST: "0.0.0.0"
    DASHBOARD_PORT: "11000"
    DASHBOARD_DEBUG: "false"
    LOG_LEVEL: "INFO"
    HEALTH_CHECK_PORT: "11000"
    HEALTH_CHECK_ENDPOINT: "/api/health"

  # Monitoring and metrics
  monitoring:
    enabled: true
    metrics_port: 9090
    log_level: "INFO"

  # Deployment configuration
  deployment:
    restart_policy: "unless-stopped"
    replicas: 1
    update_strategy: "rolling"
